[project]
name = "formiga-cli"
version = "0.1.0"
description = "A minimal, fully local chat agent for the terminal that answers questions and runs deep multi-source research with verifiable citations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Formiga contributors" }]
keywords = ["agent", "research", "cli", "local", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "prompt-toolkit>=3.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
formiga = "formiga.cli:main"

[project.urls]
Homepage = "https://github.com/formiga-cli/formiga"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formiga"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
