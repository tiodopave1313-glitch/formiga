[project]
name = "formiga"
version = "0.1.0"
description = "Harness minimalista de pesquisa profunda controlado por orçamentos e evidências."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "trafilatura>=2.0",
    "pydantic>=2.7",
]

[project.scripts]
formiga = "formiga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formiga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
