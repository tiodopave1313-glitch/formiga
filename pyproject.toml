[project]
name = "formiga"
version = "0.2.0a1"
description = "Harness minimalista de pesquisa profunda controlado por orçamentos e evidências."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "trafilatura>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
gui = ["textual>=8.2.8"]

[project.scripts]
formiga = "formiga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formiga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0",
    "textual>=8.2.8",
]
